<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Koneiden varaus</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: #eaeaea;
    margin: 20px;
}

h2 {
    text-align: center;
}

.machine-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    max-width: 1200px;
    margin: auto;
}

.machine {
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
}

.free { background: #2e7d32; }
.reserved { background: #c62828; }

#modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-box {
    background: #1e1e1e;
    padding: 25px;
    border-radius: 8px;
    width: 90%;
    max-width: 350px;
}

.modal-box h3 {
    margin-top: 0;
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #2a2a2a;
    color: white;
    border: 1px solid #444;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.confirm { background: #0078ff; color: white; }
.danger { background: #c62828; color: white; }
.cancel { background: #444; }

.footer {
    max-width: 1200px;
    margin: 20px auto;
    text-align: center;
}
</style>
